# Runs the store/sync and Notion tests (tests/run.sh) on every push that touches the
# shared logic, the server or the tests. The Android build is in android.yml.
name: Tests

on:
  push:
    paths: ["extension/**", "server/**", "tests/**", "docs/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["extension/**", "server/**", "tests/**", "docs/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Store/sync and Notion tests
        run: bash tests/run.sh
