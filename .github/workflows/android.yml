# Builds the signed Android APK in GitHub's cloud and (optionally) publishes it to
# your Questboard server, so the phone offers the update. Runs when android/ changes,
# or manually (Actions tab → "Android APK" → Run workflow).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64   base64 of questboard-release.jks
#   ANDROID_KEYSTORE_PASS  store/key password (from keystore.properties)
#   QB_URL, QB_TOKEN       optional — if set, the APK is uploaded to your server
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=questboard\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASS" "$KEYSTORE_PASS" > android/keystore.properties

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          CODE=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          NAME=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "CODE=$CODE" >> "$GITHUB_ENV"; echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publish to your Questboard server
        env:
          QB_URL: ${{ secrets.QB_URL }}
          QB_TOKEN: ${{ secrets.QB_TOKEN }}
        if: env.QB_URL != ''
        run: |
          LATEST=$(curl -sf -H "Authorization: Bearer $QB_TOKEN" "$QB_URL/api/releases/android/latest" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("code",0))' || echo 0)
          if [ "$CODE" -le "$LATEST" ]; then
            echo "Server already has code $LATEST — bump versionCode (tools/qb bump android) to publish."; exit 0
          fi
          curl -sf -H "Authorization: Bearer $QB_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @android/app/build/outputs/apk/release/app-release.apk \
            "$QB_URL/api/releases/android?code=$CODE&name=$NAME&notes=GitHub%20build%20${GITHUB_SHA::7}" > /dev/null
          echo "Published $NAME (code $CODE)"

      # Short-lived copy on GitHub. Optional: the real delivery is your server, so a full
      # artifact storage quota must not fail the build or block publishing.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: questboard-${{ env.NAME }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2
