services:
  questboard:
    build: .
    container_name: questboard
    user: "${QB_UID:-1000}:${QB_GID:-1000}"   # owner of ./data (set by tools/deploy-server.sh)
    restart: unless-stopped
    env_file: .env          # QB_TOKEN=...  (see .env.example)
    ports:
      # QB_BIND: which server address listens (deploy-server.sh sets the Tailscale IP when used,
      # so the port is NOT reachable from the internet — Docker ports bypass ufw).
      - "${QB_BIND:-0.0.0.0}:${QB_PORT_HOST:-8787}:8787"
    volumes:
      - ./data:/data
